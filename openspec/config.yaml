schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: graduate coursework building an end-to-end computer vision
  system (object detection + segmentation + video inference) for a
  real-world scenario (worker safety PPE, agribusiness, smart cities, or
  retail shelf auditing). See CLAUDE.md and Sistematizacao_Instruções.md
  at the repo root for full requirements, grading rubric, and the 5-phase
  roadmap (data/EDA -> detection baseline -> segmentation -> evaluation &
  video -> delivery). No code exists yet; the repo currently only has the
  assignment brief and an empty image/ folder.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
